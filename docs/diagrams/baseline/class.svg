.073" y="599.26" fill="#111827" font-size="14" textLength="374.35" font-family="Arial">Reject negative prices and inputs needing decimal rounding.</text><text x="20.89" y="615.359" fill="#111827" font-size="14" textLength="298.847" font-family="Arial">selectedRetailerCode is nullable and has no FK.</text><text x="445.073" y="615.359" fill="#111827" font-size="14" textLength="450.181" font-family="Arial">Null = lowest priced listing, if available; keep unavailable explicit choices.</text><text x="20.89" y="631.458" fill="#111827" font-size="14" textLength="416.404" font-family="Arial">Language fields: nullable embedded columns, not a separate table.</text><text x="445.073" y="631.458" fill="#111827" font-size="14" textLength="436.584" font-family="Arial">Require all five product labels in three languages; offers may be blank.</text><text x="20.89" y="647.556" fill="#111827" font-size="14" textLength="329.957" font-family="Arial">Diamonds: JPA-owned children or embedded values.</text><text x="445.073" y="647.556" fill="#111827" font-size="14" textLength="392.971" font-family="Arial">Keep inactive products for saved references; offers remain text.</text><line x1="17" y1="537.833" x2="899.144" y2="537.833" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="553.931" x2="899.144" y2="553.931" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="570.03" x2="899.144" y2="570.03" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="586.128" x2="899.144" y2="586.128" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="602.227" x2="899.144" y2="602.227" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="618.326" x2="899.144" y2="618.326" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="634.424" x2="899.144" y2="634.424" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="650.523" x2="899.144" y2="650.523" style="stroke:#111827;stroke-width:1;"/><line x1="17" y1="537.833" x2="17" y2="650.523" style="stroke:#111827;stroke-width:1;"/><