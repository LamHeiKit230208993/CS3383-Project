<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:747px;height:849px;background:#FFFFFF;" width="747px" height="849px" viewBox="0 0 747 849" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="19"><text x="215.419" y="23.132" fill="#111827" font-size="14" textLength="309.668" font-weight="700" font-family="Arial">Market Desk | local shopper goals through J08</text></g><!--cluster App--><g class="cluster" data-qualified-name="App" id="ent0003" data-source-line="22"><rect x="87" y="175.099" width="317" height="656" fill="#F3F4F6" style="stroke:#4B5563;stroke-width:1;" rx="2.5" ry="2.5"/><text x="115.037" y="191.168" fill="#111827" font-size="15" textLength="260.925" font-weight="700" font-family="Arial">Local Market Desk - one user, H2 file</text></g><!--entity search--><g class="entity" data-qualified-name="App.search" id="ent0004" data-source-line="23"><ellipse cx="245.728" cy="253.944" rx="122.228" ry="26.846" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="185.278" y="247.139" fill="#111827" font-size="15" textLength="120.901" font-family="Arial">Find and compare</text><text x="149.008" y="264.388" fill="#111827" font-size="15" textLength="193.44" font-family="Arial">accepted products / offer text</text></g><!--entity list--><g class="entity" data-qualified-name="App.list" id="ent0005" data-source-line="24"><ellipse cx="245.413" cy="322.881" rx="126.913" ry="27.783" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="194.978" y="313.993" fill="#111827" font-size="15" textLength="100.869" font-family="Arial">Manage My list</text><text x="136.611" y="331.241" fill="#111827" font-size="15" textLength="217.603" font-family="Arial">(quantity, retailer, checked state)</text></g><!--entity budget--><g class="entity" data-qualified-name="App.budget" id="ent0006" data-source-line="25"><ellipse cx="245.563" cy="392.926" rx="113.563" ry="27.327" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="167.172" y="389.519" fill="#111827" font-size="15" textLength="156.782" font-family="Arial">Review planned budget</text><text x="168.022" y="406.768" fill="#111827" font-size="15" textLength="155.083" font-family="Arial">and category estimates</text></g><!--entity wishlist--><g class="entity" data-qualified-name="App.wishlist" id="ent0007" data-source-line="26"><ellipse cx="245.628" cy="461.308" rx="78.628" ry="26.709" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="197.274" y="456.826" fill="#111827" font-size="15" textLength="96.709" font-family="Arial">Save / remove</text><text x="190.609" y="474.075" fill="#111827" font-size="15" textLength="110.039" font-family="Arial">wishlist products</text></g><!--entity track--><g class="entity" data-qualified-name="App.track" id="ent0008" data-source-line="27"><ellipse cx="245.507" cy="530.9" rx="134.507" ry="29.301" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="141.705" y="528.5" fill="#111827" font-size="15" textLength="207.605" font-family="Arial">Manage exact-product / retailer</text><text x="151.288" y="545.749" fill="#111827" font-size="15" textLength="188.438" font-family="Arial">tracking and retained history</text></g><!--entity alerts--><g class="entity" data-qualified-name="App.alerts" id="ent0009" data-source-line="28"><ellipse cx="245.588" cy="603.316" rx="131.588" ry="28.718" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="153.453" y="599.125" fill="#111827" font-size="15" textLength="184.27" font-family="Arial">Manage target / drop alerts,</text><text x="147.194" y="616.373" fill="#111827" font-size="15" textLength="196.787" font-family="Arial">timing, read state and snooze</text></g><!--entity reminder--><g class="entity" data-qualified-name="App.reminder" id="ent0010" data-source-line="29"><ellipse cx="245.659" cy="674.33" rx="131.659" ry="28.732" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="154.784" y="669.864" fill="#111827" font-size="15" textLength="181.75" font-family="Arial">Manage interval reminders;</text><text x="146.031" y="687.112" fill="#111827" font-size="15" textLength="199.255" font-family="Arial">clear, snooze or add to My list</text></g><!--entity sample--><g class="entity" data-qualified-name="App.sample" id="ent0011" data-source-line="30"><ellipse cx="245.254" cy="737.049" rx="87.754" ry="19.951" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="172.29" y="742.174" fill="#111827" font-size="15" textLength="145.928" font-family="Arial">Load checked sample</text></g><!--entity refresh--><g class="entity" data-qualified-name="App.refresh" id="ent0012" data-source-line="31"><ellipse cx="245.265" cy="789.152" rx="78.265" ry="18.053" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="183.577" y="794.276" fill="#111827" font-size="15" textLength="123.376" font-family="Arial">Refresh live prices</text></g><!--entity shopper--><g class="entity" data-qualified-name="shopper" id="ent0001" data-source-line="20"><ellipse cx="34.356" cy="501.099" rx="8" ry="8" fill="#F3F4F6" style="stroke:#4B5563;stroke-width:0.5;"/><path d="M34.356,509.099 L34.356,536.099 M21.356,517.099 L47.356,517.099 M34.356,536.099 L21.356,551.099 M34.356,536.099 L47.356,551.099" style="stroke:#4B5563;stroke-width:0.5;" fill="none"/><text x="6" y="566.668" fill="#111827" font-size="15" textLength="56.711" font-family="Arial">Shopper</text></g><!--entity feed--><g class="entity" data-qualified-name="feed" id="ent0002" data-source-line="21"><ellipse cx="580.692" cy="750.599" rx="8" ry="8" fill="#F3F4F6" style="stroke:#4B5563;stroke-width:0.5;"/><path d="M580.692,758.599 L580.692,785.599 M567.692,766.599 L593.692,766.599 M580.692,785.599 L567.692,800.599 M580.692,785.599 L593.692,800.599" style="stroke:#4B5563;stroke-width:0.5;" fill="none"/><text x="519" y="816.168" fill="#111827" font-size="15" textLength="123.384" font-family="Arial">Consumer Council</text><text x="519" y="833.417" fill="#111827" font-size="15" textLength="65.874" font-family="Arial">price feed</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="44"><path d="M428,43.099 L428,363.572 L732.506,363.572 L732.506,53.099 L722.506,43.099 L428,43.099" style="stroke:#4B5563;stroke-width:0.5;" fill="#E5E7EB"/><path d="M722.506,43.099 L722.506,53.099 L732.506,53.099 L722.506,43.099" style="stroke:#4B5563;stroke-width:1;" fill="#E5E7EB"/><text x="434" y="62.168" fill="#111827" font-size="15" textLength="126.694" font-weight="700" font-family="Arial">Reading this view</text><text x="434" y="79.417" fill="#111827" font-size="15" textLength="252.634" font-family="Arial">Saving, tracking, and adding to My list</text><text x="434" y="96.666" fill="#111827" font-size="15" textLength="140.083" font-family="Arial">are separate actions.</text><text x="434" y="113.914" fill="#111827" font-size="15" font-family="Arial"> </text><text x="434" y="131.163" fill="#111827" font-size="15" textLength="260.962" font-family="Arial">History records changes after accepted</text><text x="434" y="148.411" fill="#111827" font-size="15" textLength="255.945" font-family="Arial">LIVE imports. The sample is excluded.</text><text x="434" y="165.66" fill="#111827" font-size="15" font-family="Arial"> </text><text x="434" y="182.908" fill="#111827" font-size="15" textLength="214.27" font-family="Arial">Alerts and reminders are in-app.</text><text x="434" y="200.157" fill="#111827" font-size="15" textLength="283.506" font-family="Arial">A closed app collects and delivers nothing.</text><text x="434" y="217.405" fill="#111827" font-size="15" font-family="Arial"> </text><text x="434" y="234.654" fill="#111827" font-size="15" textLength="230.164" font-family="Arial">Budgets describe a shopping plan,</text><text x="434" y="251.902" fill="#111827" font-size="15" textLength="225.146" font-family="Arial">not purchases or actual spending.</text><text x="434" y="269.151" fill="#111827" font-size="15" font-family="Arial"> </text><text x="434" y="286.399" fill="#111827" font-size="15" textLength="234.265" font-family="Arial">Offer text is preserved; promotional</text><text x="434" y="303.648" fill="#111827" font-size="15" textLength="190.115" font-family="Arial">discounts are not calculated.</text><text x="434" y="320.896" fill="#111827" font-size="15" font-family="Arial"> </text><text x="434" y="338.145" fill="#111827" font-size="15" textLength="281.836" font-family="Arial">The feed is a supporting actor on the right.</text><text x="434" y="355.394" fill="#111827" font-size="15" textLength="222.605" font-family="Arial">Only the shopper starts a refresh.</text></g><!--link shopper to search--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk13" data-source-line="33" data-link-type="association"><path d="M35.89,492.479 C37.34,431.459 43.72,316.729 71,288.099 C85.4,272.989 104.39,263.509 124.51,257.729" style="stroke:#4B5563;stroke-width:1;" fill="none" id="shopper-search"/></g><!--link shopper to list--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk14" data-source-line="34" data-link-type="association"><path d="M38.54,492.269 C42.89,447.159 52.49,376.549 71,358.099 C84.82,344.329 102.46,335.229 121.17,329.339" style="stroke:#4B5563;stroke-width:1;" fill="none" id="shopper-list"/></g><!--link shopper to budget--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk15" data-source-line="35" data-link-type="association"><path d="M39.21,492.429 C43.39,470.179 52.24,443.469 71,427.099 C88.34,411.959 110.41,402.769 132.96,397.349" style="stroke:#4B5563;stroke-width:1;" fill="none" id="shopper-budget"/></g><!--link shopper to wishlist--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk16" data-source-line="36" data-lin