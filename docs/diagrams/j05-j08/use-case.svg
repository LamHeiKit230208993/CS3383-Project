<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:741px;height:843px;background:#FFFFFF;" width="741px" height="843px" viewBox="0 0 741 843" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="19"><text x="212.419" y="23.132" fill="#111827" font-size="14" textLength="309.668" font-weight="700" font-family="Arial">Market Desk | local shopper goals through J08</text></g><!--cluster App--><g class="cluster" data-qualified-name="App" id="ent0003" data-source-line="22"><rect x="87" y="175.099" width="311" height="650" fill="#F3F4F6" style="stroke:#4B5563;stroke-width:1;" rx="2.5" ry="2.5"/><text x="112.037" y="191.168" fill="#111827" font-size="15" textLength="260.925" font-weight="700" font-family="Arial">Local Market Desk - one user, H2 file</text></g><!--entity search--><g class="entity" data-qualified-name="App.search" id="ent0004" data-source-line="23"><ellipse cx="242.728" cy="253.944" rx="122.228" ry="26.846" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="182.278" y="247.139" fill="#111827" font-size="15" textLength="120.901" font-family="Arial">Find and compare</text><text x="146.008" y="264.388" fill="#111827" font-size="15" textLength="193.44" font-family="Arial">accepted products / offer text</text></g><!--entity list--><g class="entity" data-qualified-name="App.list" id="ent0005" data-source-line="24"><ellipse cx="242.413" cy="322.881" rx="126.913" ry="27.783" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="191.978" y="313.993" fill="#111827" font-size="15" textLength="100.869" font-family="Arial">Manage My list</text><text x="133.611" y="331.241" fill="#111827" font-size="15" textLength="217.603" font-family="Arial">(quantity, retailer, checked state)</text></g><!--entity budget--><g class="entity" data-qualified-name="App.budget" id="ent0006" data-source-line="25"><ellipse cx="242.563" cy="392.926" rx="113.563" ry="27.327" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="164.172" y="389.519" fill="#111827" font-size="15" textLength="156.782" font-family="Arial">Review planned budget</text><text x="165.022" y="406.768" fill="#111827" font-size="15" textLength="155.083" font-family="Arial">and category estimates</text></g><!--entity wishlist--><g class="entity" data-qualified-name="App.wishlist" id="ent0007" data-source-line="26"><ellipse cx="242.628" cy="461.308" rx="78.628" ry="26.709" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="194.274" y="456.826" fill="#111827" font-size="15" textLength="96.709" font-family="Arial">Save / remove</text><text x="187.609" y="474.075" fill="#111827" font-size="15" textLength="110.039" font-family="Arial">wishlist products</text></g><!--entity track--><g class="entity" data-qualified-name="App.track" id="ent0008" data-source-line="27"><ellipse cx="242.298" cy="528.033" rx="112.298" ry="26.435" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="161.852" y="525.918" fill="#111827" font-size="15" textLength="160.891" font-family="Arial">Track one or all retailers</text><text x="176.01" y="543.166" fill="#111827" font-size="15" textLength="132.576" font-family="Arial">for an exact product</text></g><!--entity alerts--><g class="entity" data-qualified-name="App.alerts" id="ent0009" data-source-line="28"><ellipse cx="242.588" cy="597.316" rx="131.588" ry="28.718" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="150.453" y="593.125" fill="#111827" font-size="15" textLength="184.27" font-family="Arial">Manage target / drop alerts,</text><text x="144.194" y="610.373" fill="#111827" font-size="15" textLength="196.787" font-family="Arial">timing, read state and snooze</text></g><!--entity reminder--><g class="entity" data-qualified-name="App.reminder" id="ent0010" data-source-line="29"><ellipse cx="242.659" cy="668.33" rx="131.659" ry="28.732" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="151.784" y="663.864" fill="#111827" font-size="15" textLength="181.75" font-family="Arial">Manage interval reminders;</text><text x="143.031" y="681.112" fill="#111827" font-size="15" textLength="199.255" font-family="Arial">clear, snooze or add to My list</text></g><!--entity sample--><g class="entity" data-qualified-name="App.sample" id="ent0011" data-source-line="30"><ellipse cx="242.254" cy="731.049" rx="87.754" ry="19.951" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="169.29" y="736.174" fill="#111827" font-size="15" textLength="145.928" font-family="Arial">Load checked sample</text></g><!--entity refresh--><g class="entity" data-qualified-name="App.refresh" id="ent0012" data-source-line="31"><ellipse cx="242.265" cy="783.152" rx="78.265" ry="18.053" fill="#FFF" style="stroke:#4B5563;stroke-width:0.5;"/><text x="180.577" y="788.276" fill="#111827" font-size="15" textLength="123.376" font-family="Arial">Refresh live prices</text></g><!--entity shopper--><g class="entity" data-qualified-name="shopper" id="ent0001" data-source-line="20"><ellipse cx="34.356" cy="498.099" rx="8" ry="8" fill="#F3F4F6" style="stroke:#4B5563;stroke-width:0.5;"/><path d="M34.356,506.099 L34.356,533.099 M21.356,514.099 L47.356,514.099 M34.356,533.099 L21.356,548.099 M34.356,533.099 L47.356,548.099" style="stroke:#4B5563;stroke-width:0.5;" fill="none"/><text x="6" y="563.668" fill="#111827" font-size="15" textLength="56.711" font-family="Arial">Shopper</text></g><!--entity feed--><g class="entity" data-qualified-name="feed" id="ent0002" data-source-line="21"><ellipse cx="574.692" cy="744.599" rx="8" ry="8" fill="#F3F4F6" style="stroke:#4B5563;stroke-width:0.5;"/><path d="M574.692,752.599 L574.692,779.599 M561.692,760.599 L587.692,760.599 M574.692,779.599 L561.692,794.599 M574.692,779.599 L587.692,794.599" style="stroke:#4B5563;stroke-width:0.5;" fill="none"/><text x="513" y="810.168" fill="#111827" font-size="15" textLength="123.384" font-family="Arial">Consumer Council</text><text x="513" y="827.417" fill="#111827" font-size="15" textLength="65.874" font-family="Arial">price feed</text></g><g class="entity" data-qualified-name="GMN23" id="ent0024" data-source-line="44"><path d="M422,43.099 L422,363.572 L726.506,363.572 L726.506,53.099 L716.506,43.099 L422,43.099" style="stroke:#4B5563;stroke-width:0.5;" fill="#E5E7EB"/><path d="M716.506,43.099 L716.506,53.099 L726.506,53.099 L716.506,43.099" style="stroke:#4B5563;stroke-width:1;" fill="#E5E7EB"/><text x="428" y="62.168" fill="#111827" font-size="15" textLength="126.694" font-weight="700" font-family="Arial">Reading this view</text><text x="428" y="79.417" fill="#111827" font-size="15" textLength="252.634" font-family="Arial">Saving, tracking, and adding to My list</text><text x="428" y="96.666" fill="#111827" font-size="15" textLength="140.083" font-family="Arial">are separate actions.</text><text x="428" y="113.914" fill="#111827" font-size="15" font-family="Arial"> </text><text x="428" y="131.163" fill="#111827" font-size="15" textLength="260.962" font-family="Arial">History records changes after accepted</text><text x="428" y="148.411" fill="#111827" font-size="15" textLength="255.945" font-family="Arial">LIVE imports. The sample is excluded.</text><text x="428" y="165.66" fill="#111827" font-size="15" font-family="Arial"> </text><text x="428" y="182.908" fill="#111827" font-size="15" textLength="214.27" font-family="Arial">Alerts and reminders are in-app.</text><text x="428" y="200.157" fill="#111827" font-size="15" textLength="283.506" font-family="Arial">A closed app collects and delivers nothing.</text><text x="428" y="217.405" fill="#111827" font-size="15" font-family="Arial"> </text><text x="428" y="234.654" fill="#111827" font-size="15" textLength="230.164" font-family="Arial">Budgets describe a shopping plan,</text><text x="428" y="251.902" fill="#111827" font-size="15" textLength="225.146" font-family="Arial">not purchases or actual spending.</text><text x="428" y="269.151" fill="#111827" font-size="15" font-family="Arial"> </text><text x="428" y="286.399" fill="#111827" font-size="15" textLength="234.265" font-family="Arial">Offer text is preserved; promotional</text><text x="428" y="303.648" fill="#111827" font-size="15" textLength="190.115" font-family="Arial">discounts are not calculated.</text><text x="428" y="320.896" fill="#111827" font-size="15" font-family="Arial"> </text><text x="428" y="338.145" fill="#111827" font-size="15" textLength="281.836" font-family="Arial">The feed is a supporting actor on the right.</text><text x="428" y="355.394" fill="#111827" font-size="15" textLength="222.605" font-family="Arial">Only the shopper starts a refresh.</text></g><!--link shopper to search--><g class="link" data-entity-1="ent0001" data-entity-2="ent0004" id="lnk13" data-source-line="33" data-link-type="association"><path d="M35.98,489.469 C37.57,429.089 44.15,316.329 71,288.099 C84.73,273.669 102.71,264.409 121.84,258.629" style="stroke:#4B5563;stroke-width:1;" fill="none" id="shopper-search"/></g><!--link shopper to list--><g class="link" data-entity-1="ent0001" data-entity-2="ent0005" id="lnk14" data-source-line="34" data-link-type="association"><path d="M38.68,489.559 C43.15,445.219 52.85,376.189 71,358.099 C84.27,344.869 101.11,335.999 119.02,330.149" style="stroke:#4B5563;stroke-width:1;" fill="none" id="shopper-list"/></g><!--link shopper to budget--><g class="link" data-entity-1="ent0001" data-entity-2="ent0006" id="lnk15" data-source-line="35" data-link-type="association"><path d="M39.77,489.299 C44.16,467.939 53.03,442.689 71,427.099 C87.75,412.559 108.94,403.559 130.64,398.129" style="stroke:#4B5563;stroke-width:1;" fill="none" id="shopper-budget"/></g><!--link shopper to wishlist--><g class="link" data-entity-1="ent0001" data-entity-2="ent0007" id="lnk16" data-source-line="36" data-link-type="as