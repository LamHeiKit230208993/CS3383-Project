name: Bug report
description: Report something that does not work as expected.
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Explain the problem and where it happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to repeat the problem
      placeholder: |
        1. Open...
        2. Select...
        3. The problem occurs.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: What should happen instead?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots, error messages, and setup
      description: Add useful evidence and your browser or app version. Remove passwords and private data.
