<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="destinations">
  <a th:href="@{/}" th:attr="aria-current=${scene == 'discover' or scene == 'compare' ? 'page' : null}">
    <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg><span th:text="#{app.scene.discover}">Discover</span>
  </a>
  <a th:href="@{/list}" th:attr="aria-current=${scene == 'list' ? 'page' : null}">
    <svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg><span th:text="#{app.scene.list}">Cart</span>
  </a>
  <a th:href="@{/saved}" th:attr="aria-current=${scene == 'saved' or scene == 'history' ? 'page' : null}">
    <svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg><span th:text="#{app.nav.saved}">Wishlist</span>
  </a>
  <a th:href="@{/ask}" th:attr="aria-current=${scene == 'ask' ? 'page' : null}">
    <svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg><span th:text="#{app.nav.ask}">Ask</span>
  </a>
  <a th:href="@{/alerts}" th:attr="aria-current=${scene == 'alerts' or scene == 'rules' ? 'page' : null}">
    <svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg><span th:text="#{app.nav.alerts}">Alerts</span>
  </a>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar">
  <aside class="sidebar">
    <a class="wordmark" th:href="@{/}" th:attr="aria-label=#{app.home}"><span class="brand-mark">m.</span><span>market desk<small>BY PRICEWATCH</small></span></a>
    <nav class="main-nav" th:attr="aria-label=#{app.nav.main}">
      <th:block th:replace="~{fragments/navigation :: destinations}"></th:block>
      <a class="settings-destination" th:href="@{/settings}"
         th:attr="aria-current=${scene == 'settings' or scene == 'data' or scene == 'preferences' or scene == 'personal' ? 'page' : null}">
        <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg><span th:text="#{app.scene.settings}">Settings</span>
      </a>
    </nav>
  </aside>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="mobile-navigation">
  <nav class="mobile-nav" th:attr="aria-label=#{app.nav.mobile}">
    <th:block th:replace="~{fragments/navigation :: destinations}"></th:block>
  </nav>
</th:block>
<a xmlns:th="http://www.thymeleaf.org" th:fragment="settings-gear" class="mobile-settings"
   th:href="@{/settings}" th:attr="aria-label=#{app.scene.settings}">
  <svg class="icon" aria-hidden="true"><use href="#i-settings"/></svg>
</a>
