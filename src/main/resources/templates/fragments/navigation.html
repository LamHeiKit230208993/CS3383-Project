<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="sidebar">
  <aside class="sidebar">
    <a class="wordmark" th:href="@{/}" aria-label="Market Desk home"><span class="brand-mark">m.</span><span>market desk<small>BY PRICEWATCH</small></span></a>
    <nav class="main-nav" aria-label="Main navigation">
      <p class="sidebar-label">SHOPPING</p>
      <a th:href="@{/}" th:attr="aria-current=${scene == 'discover' or scene == 'compare' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>Discover</a>
      <a th:href="@{/list}" th:attr="aria-current=${scene == 'list' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>My list</a>
      <a th:href="@{/saved}" th:attr="aria-current=${scene == 'saved' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-heart"/></svg>Saved</a>
      <a th:href="@{/budget}" th:attr="aria-current=${scene == 'budget' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>Budget</a>
      <p class="sidebar-label">ASSISTANCE</p>
      <a th:href="@{/alerts}" th:attr="aria-current=${scene == 'alerts' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>Alerts</a>
      <a th:href="@{/reminders}" th:attr="aria-current=${scene == 'reminders' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>Reminders</a>
      <a th:href="@{/planned/ask}" th:attr="aria-current=${scene == 'planned' and feature == 'ask' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-chat"/></svg>Ask<span class="planned-tag">Planned</span></a>
      <p class="sidebar-label">APP</p>
      <a class="data-nav-link" th:href="@{/data}" th:attr="aria-current=${scene == 'data' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-data"/></svg><span>Price data &amp; updates</span></a>
    </nav>
    <div class="sidebar-bottom">
      <p><span class="local-dot"></span>One local user<small>No account · saved on this device</small></p>
    </div>
  </aside>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="mobile-navigation">
  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a th:href="@{/}" th:attr="aria-current=${scene == 'discover' or scene == 'compare' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>Discover</a>
    <a th:href="@{/list}" th:attr="aria-current=${scene == 'list' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-list"/></svg>My list</a>
    <a th:href="@{/data}" th:attr="aria-current=${scene == 'data' ? 'page' : null}"><svg class="icon" aria-hidden="true"><use href="#i-data"/></svg>Price data</a>
    <details class="mobile-more">
      <summary th:classappend="${scene == 'planned' or scene == 'saved' or scene == 'alerts' or scene == 'budget' or scene == 'reminders' ? ' current' : ''}"><span aria-hidden="true">•••</span>More</summary>
      <div class="more-destinations">
        <a th:href="@{/saved}">Saved</a>
        <a th:href="@{/budget}">Budget</a>
        <a th:href="@{/alerts}">Alerts</a>
        <a th:href="@{/reminders}">Reminders</a>
        <a th:href="@{/planned/ask}">Ask <small>Planned</small></a>
      </div>
    </details>
  </nav>
</th:block>
