    <symbol id="i-list" viewBox="0 0 24 24">
      <path d="M8 5h12M8 12h12M8 19h12M3 5h.01M3 12h.01M3 19h.01"/>
    </symbol>
    <symbol id="i-cart" viewBox="0 0 24 24">
      <path d="M3 4h2l2.4 11h10.8l2.4-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/>
    </symbol>
    <symbol id="i-settings" viewBox="0 0 24 24">
      <path d="m10 3-.5 2.2-2 .9-2-.9-2 3.5 1.6 1.5v2.4L3.5 14l2 3.5 2-.7 2 1 .5 2.2h4l.5-2.2 2-1 2 .7 2-3.5-1.6-1.4v-2.4l1.6-1.5-2-3.5-2 .9-2-.9L14 3z"/><circle cx="12" cy="11.5" r="3"/>

    <symbol id="i-bell" viewBox="0 0 24 24">
      <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M10 21h4"/>

    <symbol id="i-chat" viewBox="0 0 24 24">
      <path d="M21 11.5a8.5 8.5 0 0 1-12.3 7.6L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5Z"/>
      <path d="M8 10h8M8 14h5"/>

    <symbol id="i-pack" viewBox="0 0 24 24">

    </symbol>
  </svg>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="source-banner">
  <div
    class="source-banner"
    th:classappend="${importStatus != null and importStatus.origin == 'SAMPLE' ? ' sample-banner' : ''}"
  >
    <th:block th:if="${importStatus == null}">
      <strong th:text="#{source.empty}">No prices loaded</strong>
      <span th:text="#{source.emptyHelp}">Start with a checked sample or refresh the live source.</span>
    </th:block>
    <th:block th:if="${importStatus != null}">
      <strong th:text="${importStatus.origin == 'SAMPLE'} ? #{source.sample} : #{source.saved}"></strong>
      <span th:text="${importStatus.retrievedAt != null} ? #{source.retrieved(${format.time(importStatus.retrievedAt)})} : #{offline.noTimestamp}"></span>
    </th:block>
    <a th:href="@{/data}" th:text="#{source.details}">View details ↗</a>
  </div>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="topbar">
  <header class="topbar">
    <a class="mobile-brand" th:href="@{/}">market desk<span>.</span></a>
    <th:block th:replace="~{fragments/navigation :: settings-gear}"></th:block>
  </header>
</th:block>
