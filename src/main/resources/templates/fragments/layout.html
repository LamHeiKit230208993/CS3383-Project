<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="source-banner">
  <div
    class="source-banner"
    th:classappend="${importStatus != null and importStatus.origin == 'SAMPLE' ? ' sample-banner' : ''}"
  >
    <th:block th:if="${importStatus == null}">
      <strong th:text="#{source.empty}">No prices loaded</strong>
      <span th:text="#{source.emptyHelp}">Start with a checked sample or refresh the live source.</span>
    </th:block>
    <th:block th:if="${importStatus != null}">
      <strong th:text="${importStatus.origin == 'SAMPLE'} ? #{source.sample} : #{source.saved}"></strong>
      <span th:text="${importStatus.retrievedAt != null} ? #{source.retrieved(${format.time(importStatus.retrievedAt)})} : #{offline.noTimestamp}"></span>
    </th:block>
    <a th:href="@{/data}" th:text="#{source.details}">View details ↗</a>
  </div>
</th:block>
<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="topbar">
  <header class="topbar">
    <a class="mobile-brand" th:href="@{/}">market desk<span>.</span></a>
    <th:block th:replace="~{fragments/navigation :: settings-gear}"></th:block>
  </header>
</th:block>
