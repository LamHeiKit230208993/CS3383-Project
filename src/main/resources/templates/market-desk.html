<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title th:text="${title + ' · Market Desk'}">Market Desk</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232854ce'/%3E%3Ctext x='5' y='25' fill='white' font-family='sans-serif' font-size='28' font-weight='bold'%3Em%3C/text%3E%3C/svg%3E"
    >
    <link rel="stylesheet" th:href="@{/css/market-desk.css}">
    <script th:src="@{/js/market-desk.js}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <th:block th:replace="~{fragments/layout :: icon-library}"></th:block>
    <div class="workspace">
      <th:block th:replace="~{fragments/navigation :: sidebar}"></th:block>
      <div class="workspace-body">
        <th:block th:replace="~{fragments/layout :: source-banner}"></th:block>
        <th:block th:replace="~{fragments/layout :: topbar}"></th:block>
        <main id="main-content" tabindex="-1">
          <div class="notice" role="status" th:if="${notice}" th:text="${notice}"></div>
          <div class="notice error" role="alert" th:if="${error}" th:text="${error}"></div>
          <th:block th:if="${scene == 'discover'}">
            <th:block th:replace="~{pages/discover :: content}"></th:block>
          </th:block>
          <th:block th:if="${scene == 'compare'}">
            <th:block th:replace="~{pages/compare :: content}"></th:block>
          </th:block>
          <th:block th:if="${scene == 'list'}">
            <th:block th:replace="~{pages/list :: content}"></th:block>
          </th:block>
          <th:block th:if="${scene == 'data'}">
            <th:block th:replace="~{pages/data :: content}"></th:block>
          </th:block>
          <th:block th:if="${scene == 'planned'}">
            <th:block th:replace="~{pages/planned :: content}"></th:block>
          </th:block>
          <th:block th:if="${scene == 'error'}">
            <th:block th:replace="~{pages/error :: content}"></th:block>
          </th:block>
          <th:block th:replace="~{fragments/layout :: page-footer}"></th:block>
        </main>
      </div>
    </div>
    <th:block th:replace="~{fragments/navigation :: mobile-navigation}"></th:block>
  </body>
</html>
