<section xmlns:th="http://www.thymeleaf.org" th:fragment="content" aria-labelledby="alerts-title" class="alerts-center">
  <header class="page-heading">
    <h1 id="alerts-title" th:text="#{app.nav.alerts}">Alerts</h1>
  </header>
  <div class="alerts-layout">
    <section class="panel alert-history" aria-labelledby="events-title">
      <h2 id="events-title" th:text="#{alertCenter.history}">Alert history</h2>
      <div th:if="${history.isEmpty()}" class="empty-state">
        <p th:text="#{alertCenter.empty}">Price alerts and scheduled reminders will appear here.</p>
      </div>
      <article class="alert-row" th:each="row : ${history}"
               th:with="label=${productLabels.get(row.productCode)},name=${label == null ? row.productCode : label.name}">
        <div class="alert-row-heading">
          <h3 th:text="${name}"></h3>
          <time th:datetime="${row.createdAt}" th:text="${format.time(row.createdAt)}"></time>
        </div>
        <th:block th:if="${row.legacy != null}" th:with="event=${row.legacy}">
          <span class="status-pill" th:text="#{${'alerts.type.' + event.type}}"></span>
          <p th:text="${event.retailerCode}"></p>
          <p th:if="${event.price != null and event.observedAt != null}"
             th:text="#{alerts.currentPrice(${format.money(event.price)},${format.time(event.observedAt)})}"></p>
          <p th:if="${event.previousPrice != null and event.previousObservedAt != null}"
             th:text="#{alerts.previousPrice(${format.money(event.previousPrice)},${format.time(event.previousObservedAt)})}"></p>
          <div class="alert-actions">
            <span class="helper" th:if="${event.read}" th:text="#{alerts.read}">Read</span>
            <span class="helper" th:if="${!event.available}" th:text="#{alertCenter.snoozed}">Snoozed</span>
            <form th:if="${!event.read}" th:action="@{/alerts/events/{id}/read(id=${event.id})}" method="post">
              <button class="button secondary" th:text="#{alerts.markRead}">Mark read</button>
            </form>
            <form th:if="${!event.read and event.available}" th:action="@{/alerts/events/{id}/snooze(id=${event.id})}" method="post">
              <button class="button secondary" th:text="#{common.snooze}">Snooze</button>
            </form>
          </div>
        </th:block>
        <th:block th:if="${row.price != null}" th:with="event=${row.price}">
          <span class="status-pill" th:text="#{alerts.type.TARGET}">Target price</span>
          <p th:text="#{alertCenter.target(${format.money(event.target)})}"></p>
          <dl class="alert-retailers">
            <div th:each="retailer : ${event.retailers}">
              <dt th:text="${retailer.retailerCode}"></dt>
              <dd th:text="${format.money(retailer.price)}"></dd>
            </div>
          </dl>
          <p class="helper" th:text="#{alerts.retrievedAt(${format.time(event.retrievedAt)})}"></p>
          <div class="alert-actions">
            <span class="helper" th:if="${event.read}" th:text="#{alerts.read}">Read</span>
            <span class="helper" th:if="${!event.available}" th:text="#{alertCenter.snoozed}">Snoozed</span>
            <form th:if="${!event.read}" th:action="@{/alerts/product-events/{id}/read(id=${event.id})}" method="post">
              <button class="button secondary" th:text="#{alerts.markRead}">Mark read</button>
            </form>
            <form th:if="${!event.read and event.available}" th:action="@{/alerts/product-events/{id}/snooze(id=${event.id})}" method="post">
              <button class="button secondary" th:text="#{common.snooze}">Snooze</button>
            </form>
          </div>
        </th:block>
        <th:block th:if="${row.time != null}" th:with="event=${row.time}">
          <span class="status-pill" th:text="#{alertCenter.time}">Time reminder</span>
          <p th:text="#{alertCenter.due(${format.time(event.dueAt)})}"></p>
          <p class="helper" th:text="#{cart.quantity(${event.quantity})}"></p>
          <p class="helper" th:if="${event.retailerCode != null}" th:text="#{reminders.chosen(${event.retailerCode})}"></p>
          <div class="alert-actions">
            <span class="helper" th:if="${event.read}" th:text="#{alertCenter.dismissed}">Dismissed</span>
            <span class="helper" th:if="${!event.read and !event.available}" th:text="#{alertCenter.snoozed}">Snoozed</span>
            <form th:if="${event.active and event.available}" th:action="@{/alerts/reminders/{id}/add(id=${event.id})}" method="post">
              <button class="button primary" th:text="#{compare.add}">Add to Cart</button>
            </form>
            <form th:if="${event.active}" th:action="@{/alerts/reminders/{id}/clear(id=${event.id})}" method="post">
              <button class="button secondary" th:text="#{alertCenter.dismiss}">Dismiss</button>
            </form>
            <form th:if="${event.active and event.available}" th:action="@{/alerts/reminders/{id}/snooze(id=${event.id})}" method="post">
              <button class="button secondary" th:text="#{common.snooze}">Snooze</button>
            </form>
          </div>
        </th:block>
      </article>
    </section>
    <section class="panel alert-rule-list" aria-labelledby="rules-title">
      <h2 id="rules-title" th:text="#{alertRules.heading}">Alert rules</h2>
      <p class="helper" th:if="${ruleProducts.isEmpty()}" th:text="#{alertRules.none}">Open a product to set its rules.</p>
      <a th:each="product : ${ruleProducts}" class="action-row" th:href="@{/alerts/rules(code=${product.code})}">
        <svg class="icon" aria-hidden="true"><use href="#i-bell"/></svg>
        <span th:text="${product.name}"></span><span aria-hidden="true">›</span>
      </a>
    </section>
  </div>
</section>
