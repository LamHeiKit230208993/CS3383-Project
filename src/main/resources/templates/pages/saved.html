<section xmlns:th="http://www.thymeleaf.org" th:fragment="content" aria-labelledby="saved-title" class="wishlist">
  <header class="page-heading heading-with-action">
    <h1 id="saved-title" th:text="#{app.nav.saved}">Wishlist</h1>
    <a class="button secondary" th:href="@{/}" th:text="#{common.find}">Find a product</a>
  </header>

  <form class="action-rows wishlist-candidate" th:if="${productToSave != null and productToSave.active}"
        th:action="@{/saved/save}" method="post">
    <input type="hidden" name="code" th:value="${productToSave.code}">
    <strong th:text="${productToSave.name.forLocale(#locale)}"></strong>
    <button class="button secondary" th:text="#{saved.save}">Save to wishlist</button>
  </form>
  <p class="warning" th:if="${productLookupError != null}" th:text="${productLookupError}"></p>

  <div class="empty-state panel" th:if="${savedProducts.isEmpty()}">
    <h2 th:text="#{saved.wishlistEmpty}">Your wishlist is empty.</h2>
    <p th:text="#{wishlist.emptyHelp}">Save a product to follow its prices.</p>
  </div>

  <div class="action-rows wishlist-rows" th:unless="${savedProducts.isEmpty()}">
    <form id="wishlist-batch" class="wishlist-toolbar" th:action="@{/saved/cart}" method="post">
      <button class="button primary" th:text="#{wishlist.addSelected}">Add selected to Cart</button>
    </form>
    <div class="wishlist-row" th:each="saved : ${savedProducts}" th:with="p=${saved.product}">
      <label class="check-label">
        <input type="checkbox" form="wishlist-batch" name="codes" th:value="${p.code}"
               th:attr="aria-label=#{wishlist.select(${p.name.forLocale(#locale)})}">
      </label>
      <details th:open="${openCode == p.code}">
        <summary class="action-row">
          <svg class="icon" aria-hidden="true"><use href="#i-pack"/></svg>
          <span><strong th:text="${p.name.forLocale(#locale)}"></strong>
            <small th:text="${p.brand.forLocale(#locale)}"></small>
            <small th:unless="${p.active}" th:text="#{saved.productMissing}"></small></span>
          <span class="wishlist-price" th:text="${p.lowestPrice == null} ? #{common.unknown} : ${format.money(p.lowestPrice)}"></span>
        </summary>
        <div class="wishlist-actions">
          <form th:if="${p.active}" th:action="@{/saved/cart}" method="post">
            <input type="hidden" name="codes" th:value="${p.code}">
            <button class="button primary" th:text="#{compare.add}">Add to Cart</button>
          </form>
          <a class="button secondary" th:if="${p.active}" th:href="@{/products/{code}(code=${p.code})}"
             th:text="#{wishlist.view}">View product</a>
          <a class="button secondary" th:href="@{/products/{code}/history(code=${p.code})}" th:text="#{wishlist.history}">Price history</a>
          <a class="button secondary" th:href="@{/alerts/rules(code=${p.code})}" th:text="#{wishlist.rules}">Set rules</a>
          <form th:action="@{/saved/remove}" method="post">
            <input type="hidden" name="code" th:value="${p.code}">
            <button class="button secondary" th:text="#{saved.remove}">Remove</button>
          </form>
        </div>
      </details>
    </div>
  </div>
</section>
