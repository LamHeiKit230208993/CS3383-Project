<section xmlns:th="http://www.thymeleaf.org" th:fragment="content" aria-labelledby="saved-title" class="wishlist">
  <header class="page-heading heading-with-action">
    <h1 id="saved-title" th:text="#{app.nav.saved}">Wishlist</h1>
    <a class="button secondary" th:href="@{/}" th:text="#{common.find}">Find a product</a>
  </header>

  <form class="action-rows wishlist-candidate" th:if="${productToSave != null and productToSave.active}"
        th:action="@{/saved/save}" method="post">
    <input type="hidden" name="code" th:value="${productToSave.code}">
    <strong th:text="${productToSave.name.forLocale(#locale)}"></strong>
    <button class="button secondary" th:text="#{saved.save}">Save to wishlist</button>
  </form>
  <p class="warning" th:if="${productLookupError != null}" th:text="${productLookupError}"></p>

  <div class="empty-state panel" th:if="${savedProducts.isEmpty()}">
    <h2 th:text="#{saved.wishlistEmpty}">Your wishlist is empty.</h2>
    <p th:text="#{wishlist.emptyHelp}">Save a product to follow its prices.</p>
  </div>

  <div class="action-rows wishlist-rows" th:unless="${savedProducts.isEmpty()}">
    <form id="wishlist-batch" class="wishlist-toolbar" th:action="@{/saved/cart}" method="post">
      <button class="button primary" th:text="#{wishlist.addSelected}">Add selected to Cart</button>
    </form>
    <div class="wishlist-row" th:each="saved : ${savedProducts}" th:with="p=${saved.product}">
      <label class="check-label">
        <input type="checkbox" form="wishlist-batch" name="codes" th:value="${p.code}"
               th:attr="aria-label=#{wishlist.select(${p.name.forLocale(#locale)})}">
      </label>
      <div class="wishlist-item" th:classappend="${openCode == p.code} ? 'is-focused'">
        <div class="wishlist-item-copy">
          <th:block th:replace="~{fragments/product-category :: icon(${p})}"></th:block>
          <div>
            <h2>
              <a th:if="${p.active}" class="wishlist-product-link"
                 th:href="@{/products/{code}(code=${p.code},fromWishlist=true)}"
                 th:text="${p.name.forLocale(#locale)}"></a>
              <th:block th:unless="${p.active}" th:text="${p.name.forLocale(#locale)}"></th:block>
            </h2>
            <p class="helper" th:text="${p.brand.forLocale(#locale)}"></p>
            <span class="wishlist-category" th:unless="${p.category2.forLocale(#locale).isBlank()}"
                  th:text="${p.category2.forLocale(#locale)}"></span>
            <p class="helper" th:unless="${p.active}" th:text="#{saved.productMissing}"></p>
          </div>
        </div>
        <strong class="wishlist-price" th:text="${p.lowestPrice == null} ? #{common.unknown} : ${format.money(p.lowestPrice)}"></strong>
        <div class="wishlist-actions">
          <a class="button secondary wishlist-action" th:href="@{/products/{code}/history(code=${p.code})}"
             th:attr="aria-label=#{wishlist.history},title=#{wishlist.history}">
            <svg class="icon" aria-hidden="true"><use href="#i-history-chart"/></svg>
            <span aria-hidden="true" th:text="#{wishlist.history}"></span>
          </a>
          <a class="button secondary wishlist-action" th:href="@{/alerts/rules(code=${p.code},from='saved')}" data-open-alert-rules
             th:attr="aria-label=#{wishlist.rules},title=#{wishlist.rules}">
            <svg class="icon" aria-hidden="true"><use href="#i-bell-ring"/></svg>
            <span aria-hidden="true" th:text="#{wishlist.rules}"></span>
          </a>
          <form class="wishlist-remove" th:action="@{/saved/remove}" method="post">
            <input type="hidden" name="code" th:value="${p.code}">
            <button class="button secondary wishlist-action" th:attr="aria-label=#{saved.remove},title=#{saved.remove}">
              <svg class="icon" aria-hidden="true"><use href="#i-remove-item"/></svg>
              <span aria-hidden="true" th:text="#{saved.remove}"></span>
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>
