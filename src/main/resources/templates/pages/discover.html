<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="content">
  <section class="discover-page" aria-labelledby="discover-title">
    <form class="search-box discover-search" role="search" th:action="@{/}" method="get">
      <div class="discover-search-heading">
        <h1 id="discover-title"><label for="product-search" th:text="#{discover.searchLabel}">Find a product</label></h1>
        <p class="helper" th:text="#{discover.placeholder}">Product name, brand or code</p>
      </div>
      <div class="search-controls">
        <div class="discover-query">
          <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input id="product-search" name="q" th:value="${q}" th:placeholder="#{discover.example}"
                 autocomplete="off" maxlength="200">
        </div>
        <button class="button primary" type="submit" th:text="#{discover.search}">Search</button>
      </div>
      <div class="discover-filter">
        <label for="category-filter" th:text="#{discover.category}">Category</label>
        <select id="category-filter" name="category">
          <option value="" th:text="#{discover.categories}">All categories</option>
          <option th:each="c : ${categories}" th:with="label=${categoryLabels.get(c)}"
                  th:value="${c}" th:selected="${c == category}"
                  th:text="${label == null ? c : label.forLocale(#locale)}"></option>
        </select>
      </div>
    </form>

    <aside class="panel discover-shopping" aria-labelledby="discover-shopping-title">
      <div class="discover-shopping-heading">
        <h2 id="discover-shopping-title" th:text="#{discover.basketTitle}">Your next shop</h2>
        <span class="discover-pack-count"
              th:text="${summary.totalQuantity == 1} ? #{discover.basketPack} : #{discover.basketPacks(${summary.totalQuantity})}"></span>
      </div>
      <div class="discover-estimate">
        <span th:text="${summary.unknownItemCount > 0} ? #{common.subtotal} : #{discover.estimate}">Estimated cart</span>
        <strong th:text="${format.money(summary.knownSubtotal)}"></strong>
      </div>
      <p class="helper" th:if="${summary.unknownItemCount > 0}" th:text="#{common.missingPrices(${summary.unknownItemCount})}"></p>
      <ul class="discover-cart-preview" th:unless="${previewItems.isEmpty()}">
        <li th:each="item : ${previewItems}">
          <span th:text="${item.product.name.forLocale(#locale)}"></span>
          <small th:text="${'× ' + item.quantity}"></small>
        </li>
        <li class="helper" th:if="${cartLineCount > previewItems.size()}"
            th:text="#{discover.moreCartLines(${cartLineCount - previewItems.size()})}"></li>
      </ul>
      <th:block th:replace="~{fragments/shop-budget :: progress(${budget})}"></th:block>
      <a class="button primary discover-review" th:href="@{/list}">
        <span th:text="#{discover.basketLink}">Review Cart</span><span aria-hidden="true">→</span>
      </a>
    </aside>

    <section class="discover-results" aria-labelledby="discover-results-title">
      <header class="section-heading">
        <h2 id="discover-results-title"
            th:text="${related} ? #{discover.relatedTitle} : (${q.isBlank()} ? #{discover.catalogueTitle} : #{discover.results})"></h2>
        <span class="helper" th:text="#{common.productCount(${resultCount})}"></span>
      </header>
      <div class="match-tabs" th:if="${!q.isBlank()}">
        <a th:href="@{/(q=${q},category=${category})}" th:attr="aria-current=${!related ? 'page' : null}"
           th:text="#{discover.matchesCount(${directCount})}"></a>
        <a th:if="${relatedCount > 0}" th:href="@{/(q=${q},category=${category},related=true)}"
           th:attr="aria-current=${related ? 'page' : null}" th:text="#{discover.relatedCount(${relatedCount})}"></a>
      </div>
      <p class="helper related-explanation" th:if="${related}" th:text="#{discover.relatedHelp}"></p>
      <div class="empty-state panel" th:if="${resultCount == 0}">
        <svg class="icon large" aria-hidden="true"><use href="#i-pack"/></svg>
        <h3 th:text="${importStatus == null} ? #{discover.emptyCatalogue} : #{discover.emptySearch}"></h3>
        <p th:text="${importStatus == null} ? #{discover.emptyCatalogueHelp} : #{discover.emptySearchHelp}"></p>
        <a class="button primary" th:href="${importStatus == null ? '/data' : '/'}"
           th:text="${importStatus == null} ? #{discover.load} : #{discover.clear}"></a>
      </div>
      <div class="product-grid" th:unless="${products.isEmpty()}">
        <article class="product-card" th:each="p : ${products}">
          <div class="product-art">
            <span class="small-tag" th:unless="${p.category2.forLocale(#locale).isBlank()}"
                  th:text="${p.category2.forLocale(#locale)}"></span>
            <div class="discover-category-art">
              <th:block th:replace="~{fragments/product-category :: icon(${p})}"></th:block>
            </div>
          </div>
          <div class="product-details">
            <p class="product-brand" th:text="${p.brand.forLocale(#locale)}" translate="no"></p>
            <h3><a th:href="@{/products/{code}(code=${p.code})}" th:text="${p.name.forLocale(#locale)}"></a></h3>
            <p class="alternate-name" lang="zh-Hant" th:if="${#locale.language == 'en' and p.name.zhHant != p.name.forLocale(#locale)}"
               th:text="${p.name.zhHant}"></p>
            <p class="product-code" th:text="${p.code}" translate="no"></p>
            <div class="product-price-row">
              <div>
                <span class="helper" th:text="#{discover.lowest}">Lowest listed price</span>
                <strong class="product-price" th:text="${p.lowestPrice == null} ? #{common.notListed} : ${format.money(p.lowestPrice)}"></strong>
                <span class="retailer-label" th:if="${p.lowestListings.size() > 1}"
                      th:text="#{discover.ties(${p.lowestListings.size()})}"></span>
                <span class="retailer-label" th:if="${p.lowestListings.size() == 1}"
                      th:text="${p.lowestListings[0].retailerCode}"></span>
              </div>
              <a class="compare-link" th:href="@{/products/{code}(code=${p.code})}"
                 th:attr="aria-label=#{discover.compareLabel(${p.name.forLocale(#locale)})}" th:text="#{discover.compare}">Compare →</a>
            </div>
          </div>
        </article>
      </div>
      <nav class="pagination" th:attr="aria-label=#{discover.pages}" th:if="${pageCount > 1}">
        <a class="button secondary" th:if="${pageNumber > 1}"
           th:href="@{/(q=${q},category=${category},related=${related},page=${pageNumber - 1})}" th:text="#{discover.previous}"></a>
        <span th:text="#{discover.pageNumber(${pageNumber},${pageCount})}"></span>
        <a class="button secondary" th:if="${pageNumber < pageCount}"
           th:href="@{/(q=${q},category=${category},related=${related},page=${pageNumber + 1})}" th:text="#{discover.next}"></a>
      </nav>
      <p class="source-note" th:text="#{discover.sourceNote}"></p>
    </section>
  </section>
</th:block>
