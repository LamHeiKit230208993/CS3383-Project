spring.application.name=pricewatch
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/pricewatch
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

pricewatch.daily-url=https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json

# Keep redirect URLs clean (no ;jsessionid=...) so post-import redirects hit the mapped routes.
server.servlet.session.tracking-modes=cookie
