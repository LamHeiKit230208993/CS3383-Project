spring.application.name=pricewatch
server.port=8080
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/pricewatch;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
# The import service enforces the 2 MB list limit; allow a little room so an
# oversized file reaches the service and gets a clear validation message.
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB
pricewatch.source-url=https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json

# Ask uses an OpenAI-compatible provider. Keep the key in the environment or an
# untracked local properties file; never commit it or print it.
pricewatch.ai.base-url=${PRICEWATCH_AI_BASE_URL:https://llm.cs.cityu.edu.hk/v1}
pricewatch.ai.model=${PRICEWATCH_AI_MODEL:CS3383/DeepSeek-V4-Flash}
pricewatch.ai.api-key=${PRICEWATCH_AI_API_KEY:}
pricewatch.ai.timeout-seconds=15
