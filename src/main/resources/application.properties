spring.application.name=pricewatch
spring.config.import=optional:file:.env
server.port=8080
server.address=0.0.0.0
spring.datasource.url=jdbc:h2:file:./data/pricewatch;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.messages.basename=messages,shopping-messages,chat-messages,core-feedback,personal-messages,alert-editor,ask-shopping-messages
spring.messages.fallback-to-system-locale=false
pricewatch.source-url=https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json
pricewatch.chat.base-url=${PRICEWATCH_CHAT_BASE_URL:https://llm.cs.cityu.edu.hk/v1}
pricewatch.chat.model=${PRICEWATCH_CHAT_MODEL:CS3383/DeepSeek-V4-Flash}
