spring.application.name=pricewatch
server.port=8080
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/pricewatch;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.messages.basename=messages,shopping-messages,chat-messages,core-feedback,personal-messages
spring.messages.fallback-to-system-locale=false
pricewatch.source-url=https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json
