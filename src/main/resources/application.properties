spring.application.name=pricewatch
server.port=8080

# Add the Vite build output as a static-resource location so:
#   1. The built SPA at frontend/dist/ is served from "/".
#   2. Spring's WelcomePageHandlerMapping finds /index.html there too
#      (it only consults these locations by default, not file paths
#      registered programmatically in WebConfig).
spring.web.resources.static-locations=classpath:/static/,file:./frontend/dist/
