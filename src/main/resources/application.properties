spring.application.name=pricewatch
server.port=8080
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/pricewatch;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
pricewatch.zone-id=Asia/Hong_Kong
pricewatch.source-url=https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json
