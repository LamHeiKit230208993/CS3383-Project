spring.application.name=pricewatch
server.port=8080
# Loopback only by default. For a phone on the same Wi-Fi, start with
# --server.address=0.0.0.0 (or 0.0.0.0 in SERVER_ADDRESS) and list the laptop's
# LAN address in PRICEWATCH_ALLOWED_HOSTS, e.g. 192.168.1.20,192.168.1.20:8080.
server.address=${SERVER_ADDRESS:127.0.0.1}
pricewatch.allowed-hosts=${PRICEWATCH_ALLOWED_HOSTS:}
spring.datasource.url=jdbc:h2:file:./data/pricewatch;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
pricewatch.source-url=https://online-price-watch.consumer.org.hk/opw/opendata/pricewatch.json
# J12 UI languages. The /lang switch writes the LANG cookie (en, zh_TW, zh_CN).
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.web.locale=en
# J09 checked price chat. Set these in a local .env file (git-ignored) or as
# environment variables: PRICEWATCH_AI_BASE_URL and PRICEWATCH_AI_API_KEY.
# The .env file is loaded at startup; never hardcode or commit the key.
pricewatch.ai.base-url=${PRICEWATCH_AI_BASE_URL:}
pricewatch.ai.api-key=${PRICEWATCH_AI_API_KEY:}
pricewatch.ai.model=${PRICEWATCH_AI_MODEL:CS3383/DeepSeek-V4-Flash}
spring.messages.always-use-message-format=false
